<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Equipe | Linda Moça Exclusive</title>

  <!-- GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-C8PTRJQEET"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-C8PTRJQEET');
  </script>

  <style>
    :root{
      --bg:#ffffff; --card-bg:#ffffff; --text:#1b1b1b; --muted:#5d5d5d;
      --brand:#000000; --brand-hover:#28a745; --radius:16px;
      --shadow-sm:0 2px 10px rgba(0,0,0,.06); --shadow-md:0 10px 25px rgba(0,0,0,.10);
      --container:min(1200px,92vw);
    }

    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:var(--bg);
      color:var(--text);
      -webkit-tap-highlight-color:transparent;
    }

    .lmx-wrapper{display:flex;justify-content:center;padding:24px 16px;}
    .lmx-container{width:var(--container);}

    .lmx-header{text-align:center;margin-bottom:12px;}
    .lmx-title{font-size:28px;font-weight:bold;margin:0 0 4px;}
    .lmx-subtitle{font-size:15px;color:var(--muted);margin:0 0 12px;}

    .lmx-shortcuts{
      position:sticky; top:0; z-index:10; background:var(--bg);
      display:flex; gap:8px; justify-content:center;
      padding:8px 0 12px;
      border-bottom:1px dashed #eee;
    }

    .lmx-pill{
      border:none; cursor:pointer;
      padding:8px 12px; border-radius:999px;
      font-weight:700; font-size:13px;
      background:#f2f2f2;
    }

    .lmx-grid{
      display:grid; gap:16px; margin-top:16px;
      grid-template-columns:1fr;
    }

    @media(min-width:600px){
      .lmx-grid{ grid-template-columns:repeat(2,1fr); }
    }

    @media(min-width:992px){
      .lmx-grid{ grid-template-columns:repeat(3,1fr); }
    }

    .lmx-card{
      background:#fff;
      border-radius:16px;
      box-shadow:0 2px 10px rgba(0,0,0,.06);
      text-align:center;
      padding:22px;
      transition:.3s;
    }

    .lmx-card:hover{
      transform:translateY(-5px);
      box-shadow:0 10px 25px rgba(0,0,0,.10);
    }

    .lmx-badge{
      background:#000;
      color:#fff;
      font-size:12px;
      padding:6px 12px;
      border-radius:999px;
      margin-bottom:10px;
      display:inline-block;
    }

    .lmx-avatar{
      width:110px; height:110px;
      border-radius:50%;
      object-fit:cover;
      margin:0 auto 12px;
    }

    .lmx-name{ font-size:17px; font-weight:bold; }
    .lmx-role{ font-size:14px; color:#5d5d5d; margin-bottom:20px; }

    .lmx-button{
      display:inline-flex; gap:8px;
      color:#fff;
      background:#000;
      padding:12px 24px;
      border-radius:999px;
      text-decoration:none;
      font-weight:bold;
      animation:pulseGreen 2.2s infinite;
    }

    @keyframes pulseGreen{
      0%{transform:scale(1); background:#000;}
      50%{transform:scale(1.1); background:#28a745;}
      100%{transform:scale(1); background:#000;}
    }
  </style>
</head>

<body>
  <div class="lmx-wrapper">
    <section class="lmx-container">

      <header class="lmx-header">
        <h1 class="lmx-title">Nossa Equipe</h1>
        <p class="lmx-subtitle">Fale direto com uma vendedora da loja física</p>
      </header>

      <div class="lmx-grid" id="grid">

        <!-- Tayssa -->
        <article class="lmx-card">
          <span class="lmx-badge">Loja física</span>
          <img class="lmx-avatar" src="https://raw.githubusercontent.com/josefelipe43257/Publica-o-de-imagens-e-videos-publicos/refs/heads/main/Imagem%20do%20WhatsApp%20de%202025-10-11%20%C3%A0(s)%2017.54.26_aac20ae3.jpg">
          <h2 class="lmx-name">Tayssa</h2>
          <p class="lmx-role">Consultora de vendas</p>
          <a class="lmx-button"
             href="https://wa.me/5581997314351"
             target="_blank"
             data-vendedora="Tayssa">
            Falar com vendedora
          </a>
        </article>

        <!-- Vera -->
        <article class="lmx-card">
          <span class="lmx-badge">Loja física</span>
          <img class="lmx-avatar" src="https://raw.githubusercontent.com/josefelipe43257/Publica-o-de-imagens-e-videos-publicos/refs/heads/main/WhatsApp%20Image%202025-08-01%20at%2010.47.34.jpeg">
          <h2 class="lmx-name">Vera</h2>
          <p class="lmx-role">Consultora de vendas</p>
          <a class="lmx-button"
             href="https://wa.me/5581996522650"
             target="_blank"
             data-vendedora="Vera">
            Falar com vendedora
          </a>
        </article>

        <!-- Jéssica -->
        <article class="lmx-card">
          <span class="lmx-badge">Loja física</span>
          <img class="lmx-avatar" src="https://raw.githubusercontent.com/josefelipe43257/Publica-o-de-imagens-e-videos-publicos/refs/heads/main/Imagem%20do%20WhatsApp%20de%202025-10-14%20%C3%A0(s)%2017.24.45_86f21801.jpg">
          <h2 class="lmx-name">Jéssica</h2>
          <p class="lmx-role">Consultora de vendas</p>
          <a class="lmx-button"
             href="https://wa.me/5581993824864"
             target="_blank"
             data-vendedora="Jéssica">
            Falar com vendedora
          </a>
        </article>

      </div>
    </section>
  </div>

  <script>
    document.querySelectorAll('.lmx-button[data-vendedora]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        gtag('event','whatsapp_equipe_click',{
          vendedora: btn.dataset.vendedora,
          page_location: window.location.href
        });
      });
    });
  </script>
</body>
</html>
