    *{box-sizing:border-box;}

    body{

    .lmx-wrapper{
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:24px 16px;
    }

    .lmx-container{

      flex-direction:column;
      align-items:center;
      justify-content:center;
    }

    .lmx-header{

      margin-bottom:20px;
    }

      font-weight:bold;
      margin:0 0 4px;
    }

    .lmx-subtitle{
      font-size:15px;
      color:var(--muted);
      margin:0;
    }

    .lmx-grid{
      width:100%;
      display:grid;
      grid-template-columns:repeat(3, minmax(240px, 360px));
      justify-content:center;
      gap:20px;
      margin-top:16px;
    }

    .lmx-card{
      width:100%;
      background:var(--card-bg);
      border-radius:var(--radius);
      box-shadow:var(--shadow-sm);
      text-align:center;
      padding:22px;
      transition:transform .3s, box-shadow .3s;
    }

    .lmx-card:hover{
      transform:translateY(-5px);
      box-shadow:var(--shadow-md);
    }

    .lmx-badge{
      background:var(--brand);
      color:#fff;
      font-size:12px;
      padding:6px 12px;
      border-radius:999px;
      display:inline-block;
      margin-bottom:10px;
    }

    .lmx-avatar{
      width:110px;
      height:110px;
      border-radius:50%;
      object-fit:cover;
      object-position:center top;
      margin:0 auto 12px;
      box-shadow:0 6px 16px rgba(0,0,0,0.1);
      display:block;
    }

    .lmx-name{
      font-size:17px;
      font-weight:bold;
      margin:10px 0 4px;
    }

    .lmx-role{
      font-size:14px;
      color:var(--muted);
      margin-bottom:20px;
    }

    .lmx-button{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      text-decoration:none;
      color:#fff;
      background:var(--brand);
      padding:12px 24px;
      border-radius:999px;
      font-weight:bold;
      font-size:14px;
      min-height:44px;
      transition:transform .2s ease-in-out, background-color .2s ease-in-out;
      animation:pulseGreen 2.2s infinite ease-in-out;
    }

    @keyframes pulseGreen{
      0%{transform:scale(1); background-color:var(--brand);}
      50%{transform:scale(1.1); background-color:var(--brand-hover);}
      100%{transform:scale(1); background-color:var(--brand);}
    }

    .lmx-button:hover{
      transform:scale(1.1);
      background:var(--brand-hover);
    }

    }

          const cards = Array.from(grid.children);
